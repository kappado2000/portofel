name: iOS TestFlight build

# Pașii sunt în kappado2000/ci-flutter/.github/workflows/ios-testflight.yml (comun tuturor aplicațiilor).
on:
  workflow_dispatch: {}
  # Verificare săptămânală (luni, 06:00 UTC): build nou doar dacă ultimul
  # build TestFlight expiră în mai puțin de 21 de zile (expiră la 90).
  # Acord explicit al userului pentru aceste build-uri automate: 2026-10-28.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  testflight:
    permissions:
      actions: write
      contents: write
    uses: kappado2000/ci-flutter/.github/workflows/ios-testflight.yml@main
    with:
      app_id: '6827873758'
      # ID-ul aplicației deja instalate (creat de AltStore): TestFlight o
      # actualizează pe loc, păstrând datele locale.
      bundle_id: com.kappa.portofel.portofel.FUR5C9CYR8
      project_bundle_id: com.kappa.portofel.portofel
      profile_name: Cont App Store
    secrets: inherit
